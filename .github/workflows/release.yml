name: Release

# GitHub runs a push workflow from the branch that received the push.
# This file must stay on main so a push to main packages and publishes.
# Pull requests still run the quality gate, but never publish.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Tests run with --experimental-strip-types, which needs Node 22.6+.
          node-version: '22.12'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Verify documentation drift
        run: npm run verify

  build:
    name: Build ${{ matrix.target }}
    needs: quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            target: win32-x64
          - os: ubuntu-latest
            target: linux-x64
          # macos-13 is retired; macos-15-intel is the current standard x64 macOS runner.
          - os: macos-15-intel
            target: darwin-x64
          # ffmpeg-static 5.3.0 publishes ffmpeg-darwin-arm64 and onnxruntime-node
          # 1.14.0 ships bin/napi-v3/darwin/arm64, so this target can be staged.
          - os: macos-14
            target: darwin-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify dictation binaries for this platform
        run: node scripts/verify-dictation.mjs

      - name: Package platform VSIX
        run: npm run package-platform -- --target ${{ matrix.target }}

      - name: Upload platform VSIX
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: melink-sidecode-*-${{ matrix.target }}.vsix
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download platform VSIXes
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: '*'
          merge-multiple: true

      - name: Write release notes
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v${version}.${GITHUB_RUN_NUMBER}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "name=SideCode ${tag}" >> "$GITHUB_OUTPUT"

          prev="$(git tag --list 'v*' --sort=-creatordate | head -n 1 || true)"
          {
            echo "## SideCode ${version}"
            echo
            echo "Download the VSIX that matches your OS and architecture:"
            echo
            echo "| VSIX | Platform |"
            echo "|---|---|"
            echo "| \`melink-sidecode-${version}-win32-x64.vsix\` | Windows x64 |"
            echo "| \`melink-sidecode-${version}-linux-x64.vsix\` | Linux x64 |"
            echo "| \`melink-sidecode-${version}-darwin-x64.vsix\` | macOS Intel (x64) |"
            echo "| \`melink-sidecode-${version}-darwin-arm64.vsix\` | macOS Apple Silicon (arm64) |"
            echo
            echo "Install the matching file: Extensions view → \`...\` → **Install from VSIX…**. Dictation binaries are included for the platform named in the filename."
            echo
            echo "### Changes"
            echo
            if [ -n "${prev}" ]; then
              git log "${prev}..HEAD" --no-merges --pretty=format:'- %s'
            else
              git log --no-merges -30 --pretty=format:'- %s'
            fi
            echo
          } > release-notes.md

          if ! grep -q '^- ' release-notes.md; then
            echo "- Packaged SideCode ${version} from ${GITHUB_SHA::7}." >> release-notes.md
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.notes.outputs.tag }}
          name: ${{ steps.notes.outputs.name }}
          body_path: release-notes.md
          files: release-assets/melink-sidecode-*-*.vsix
          make_latest: true
