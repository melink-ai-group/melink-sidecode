name: Bug report
description: Report a reproducible problem in sideCode
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Do not paste tokens, API keys, personal paths, or private project content. Redact them first.
  - type: input
    id: version
    attributes:
      label: sideCode version
      description: The version shown in the Extensions view or the VSIX filename.
      placeholder: 0.4.0
    validations:
      required: true
  - type: dropdown
    id: host
    attributes:
      label: Host
      options:
        - VS Code
        - Cursor
        - VSCodium
        - Another Open VSX host
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11, macOS 15 arm64, Ubuntu 24.04
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options:
        - Ollama Cloud
        - Ollama Local
        - OpenAI Codex CLI
        - OpenCode Zen
        - More than one
        - Not provider-specific
    validations:
      required: true
  - type: dropdown
    id: trust
    attributes:
      label: Workspace trust
      options:
        - Trusted
        - Restricted Mode
        - Not sure
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest sequence that shows the problem.
      placeholder: |
        1. Open sideCode...
        2. Choose...
        3. Send...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Redact tokens, personal paths, and project content.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I removed credentials, personal paths, and private project content from this report.
          required: true
        - label: I checked the README and docs/usage.md for the expected behavior.
          required: true
