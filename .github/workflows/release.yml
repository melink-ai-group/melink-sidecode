name: Release

# Quality runs on every pull request and on main. A release is built only from
# a v-prefixed tag or a manual dispatch that names an existing tag, so a normal
# push to main never publishes a release.
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing v-prefixed tag to build and publish (for example v0.3.4)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  quality:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Tests run with --experimental-strip-types, which needs Node 22.6+.
          node-version: '22.12'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Verify documentation drift
        run: npm run verify

  prepare:
    name: Prepare draft release
    needs: quality
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Create or reset the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [ "${TAG_NAME}" != "v${version}" ]; then
            echo "Tag ${TAG_NAME} does not match package version v${version}." >&2
            exit 1
          fi
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            is_draft="$(gh release view "$TAG_NAME" --json isDraft --jq '.isDraft')"
            if [ "$is_draft" != "true" ]; then
              echo "Release $TAG_NAME already exists and is published." >&2
              exit 1
            fi
            gh release edit "$TAG_NAME" --draft --title "sideCode $TAG_NAME" --notes "Build in progress."
          else
            gh release create "$TAG_NAME" --draft --verify-tag --title "sideCode $TAG_NAME" --notes "Build in progress."
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win32-x64
          - os: ubuntu-latest
            target: linux-x64
          # macos-13 is retired; macos-15-intel is the current standard x64 macOS runner.
          - os: macos-15-intel
            target: darwin-x64
          # ffmpeg-static 5.3.0 publishes ffmpeg-darwin-arm64 and onnxruntime-node
          # 1.14.0 ships bin/napi-v3/darwin/arm64, so this target can be staged.
          - os: macos-15
            target: darwin-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify dictation binaries for this platform
        run: node scripts/verify-dictation.mjs

      - name: Package platform VSIX
        run: npm run package-platform -- --target ${{ matrix.target }}

      - name: Upload VSIX to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG_NAME" melink-sidecode-*-${{ matrix.target }}.vsix --clobber

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Write release notes
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          prev="$(git tag --list 'v*' --sort=-creatordate | grep -v "^${TAG_NAME}$" | head -n 1 || true)"
          {
            echo "## sideCode ${version}"
            echo
            echo "Download the VSIX that matches your OS and architecture:"
            echo
            echo "| VSIX | Platform |"
            echo "|---|---|"
            echo "| \`melink-sidecode-${version}-win32-x64.vsix\` | Windows x64 |"
            echo "| \`melink-sidecode-${version}-linux-x64.vsix\` | Linux x64 |"
            echo "| \`melink-sidecode-${version}-darwin-x64.vsix\` | macOS Intel (x64) |"
            echo "| \`melink-sidecode-${version}-darwin-arm64.vsix\` | macOS Apple Silicon (arm64) |"
            echo
            echo "Install the matching file: Extensions view → \`...\` → **Install from VSIX…**. Dictation binaries are included for the platform named in the filename."
            echo
            echo "### Changes"
            echo
            if [ -n "${prev}" ]; then
              git log "${prev}..HEAD" --no-merges --pretty=format:'- %s'
            else
              git log --no-merges -30 --pretty=format:'- %s'
            fi
            echo
          } > release-notes.md

          if ! grep -q '^- ' release-notes.md; then
            echo "- Packaged sideCode ${version} from ${TAG_NAME}." >> release-notes.md
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$TAG_NAME" --draft=false --latest --title "sideCode $TAG_NAME" --notes-file release-notes.md
