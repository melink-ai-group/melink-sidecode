<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SideCode visual harness</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./theme.css" />
    <link rel="stylesheet" href="/dist/webview.css" />
  </head>
  <body>
    <div id="root"></div>
    <script src="./mock-vscode.js"></script>
    <script src="/dist/webview.js"></script>
    <script type="module">
      // Optional manual inspection aid: `?screen=<slug>` seeds the same host
      // messages the capture runner posts. `npm run visual` never uses this; it
      // keeps its explicit, per-screen seeding so its output stays deterministic.
      const slug = new URLSearchParams(location.search).get('screen');
      if (slug) {
        const { screenMessages } = await import('./fixtures.mjs');
        const messages = screenMessages(slug);
        const seed = () => {
          if (window.__visualReady !== true) {
            setTimeout(seed, 50);
            return;
          }
          for (const message of messages) {
            window.postMessage(message, '*');
          }
        };
        seed();
      }
    </script>
  </body>
</html>
