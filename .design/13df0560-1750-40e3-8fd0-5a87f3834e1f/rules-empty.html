<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent settings - always-allow rules (none)</title>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="./app.css">
</head>
<body class="theme-light">
<div class="workbench">

  <nav class="activitybar" aria-label="Activity bar">
    <button class="ab-item" type="button" aria-label="Explorer">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 6h6l2 2h8v10a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6z"/></svg>
    </button>
    <button class="ab-item" type="button" aria-label="Search">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="6"/><path d="m16 16 4 4"/></svg>
    </button>
    <button class="ab-item is-active" type="button" aria-label="Agent" aria-current="page">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 3l1.9 4.6L18.5 9l-4.6 1.4L12 15l-1.9-4.6L5.5 9l4.6-1.4L12 3z"/><path d="M18 15l.9 2.1L21 18l-2.1.9L18 21l-.9-2.1L15 18l2.1-.9L18 15z"/></svg>
    </button>
    <span class="ab-spacer"></span>
    <button class="ab-item" type="button" aria-label="Settings">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="3"/><path d="M12 4v2M12 18v2M4 12h2M18 12h2M6.3 6.3l1.4 1.4M16.3 16.3l1.4 1.4M17.7 6.3l-1.4 1.4M7.7 16.3l-1.4 1.4"/></svg>
    </button>
  </nav>

  <section class="sidebar" aria-label="Always-allow rules">

    <header class="view-title">
      <button class="icon-btn" type="button" aria-label="Back to chat">
        <svg class="ico-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
      <div class="view-heading">
        <span class="view-name">Always-allow rules</span>
      </div>
      <div class="view-title-actions">
        <button class="icon-btn" type="button" aria-label="Rules help">
          <svg class="ico-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
        </button>
      </div>
    </header>

    <div class="rules" aria-label="Always-allow rules">
      <div class="empty">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M12 3l7 3v5c0 4.4-2.9 7.7-7 9-4.1-1.3-7-4.6-7-9V6l7-3z"/></svg>
        <p class="empty-title">No always-allow rules</p>
        <p class="empty-text">When you choose “always allow” at an approval prompt, the rule appears here so you can remove it later.</p>
      </div>
    </div>

  </section>

  <main class="editor" aria-hidden="true">
    <div class="tabs">
      <span class="tab is-active">permissionRules.tsx</span>
    </div>
    <div class="editor-body">
      <div class="editor-line"><span class="ln">1</span><span>// Empty state: nothing outlives the task, so nothing to review.</span></div>
    </div>
  </main>

</div>
</body>
</html>
